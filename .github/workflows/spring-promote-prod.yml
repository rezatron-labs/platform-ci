name: spring-promote-prod

# The PROD gate. Native required-reviewer Environment protection is unavailable on this plan,
# so THE GATE IS THIS DELIBERATE MANUAL DISPATCH: a human promotes a candidate stage has
# already validated. The dispatching actor is recorded on the run, and the ci-bot commit pins
# the version in gitops.
#
# Promotion is a registry RE-TAG, never a rebuild: prod runs the exact bytes stage soaked, and
# the digest assertion below turns that from an intention into a checked guarantee.
#
# It promotes a release/$V or a hotfix/$V identically.
#
# Job order is deliberate: prod is deployed BEFORE the develop back-merge, so a merge conflict
# in housekeeping can never stand between a validated build and production.

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      version:
        description: "Version to promote, e.g. 1.2.0 (must have a candidate on stage)"
        required: true
        type: string
      candidate:
        description: "Candidate number to promote. Empty means whatever stage is running."
        required: false
        default: ""
        type: string
      verify-args:
        description: >
          Extra arguments appended to `./mvnw -B verify`. A service whose integration tests
          cannot run on the self-hosted pool passes -DskipITs here and runs them in its own
          lane on a hosted runner.
        required: false
        default: ""
        type: string
      java-version:
        required: false
        default: "21"
        type: string
      registry:
        required: false
        default: nexus.home:8082
        type: string
      gitops-repo:
        required: false
        default: rezatron-labs/platform-gitops
        type: string
      overlay-dir:
        description: "Gitops overlay directory; defaults to <service>. Nested for platform stacks."
        required: false
        default: ""
        type: string
      runner:
        required: false
        default: '["self-hosted","unraid"]'
        type: string
    secrets:
      NEXUS_USER:
        required: true
      NEXUS_PASS:
        required: true
      GITOPS_DEPLOY_KEY:
        required: true
      RELEASE_APP_ID:
        description: >
          App id of the GitHub App that opens this workflow's pull requests. Not required, so
          a caller without it still validates -- the step that needs it fails with an
          actionable message instead. It cannot be GITHUB_TOKEN: GitHub does not trigger
          workflows from events that token causes, so a PR opened with it never receives the
          checks develop requires and could never be merged.
        required: false
      RELEASE_APP_PRIVATE_KEY:
        description: "Private key for RELEASE_APP_ID, in PEM form."
        required: false

jobs:
  promote:
    runs-on: ${{ fromJSON(inputs.runner) }}
    outputs:
      final_tag: ${{ steps.resolve.outputs.final_tag }}
    env:
      V: ${{ inputs.version }}
      RC_IN: ${{ inputs.candidate }}
      SERVICE: ${{ inputs.service }}
      REGISTRY: ${{ inputs.registry }}
      OVERLAY_DIR: ${{ inputs.overlay-dir }}
    steps:
      - name: Checkout main (full history for the merge)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout gitops (to read what stage is running)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gitops-repo }}
          ref: main
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          path: gitops

      - name: Resolve the candidate to promote
        id: resolve
        run: |
          set -euo pipefail
          git fetch --prune --tags origin "+refs/heads/*:refs/remotes/origin/*"

          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::version must be MAJOR.MINOR.PATCH with no leading v (got '$V')"; exit 1; }

          if [ -n "$RC_IN" ]; then
            RC_TAG="v$V-rc.$RC_IN"
          else
            # Default to exactly what stage is running. Promoting "the newest candidate" would
            # let a build nobody soaked reach prod; promoting what the stage overlay points at
            # means prod gets the bytes that were actually validated.
            # Verified and retried: an unpinned asset here chooses which candidate gets
            # promoted to prod.
            YQ=/tmp/yq
            YQ_SHA256=a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7
            curl -fsSL --retry 3 --retry-delay 2 \
              https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -o "$YQ"
            echo "$YQ_SHA256  $YQ" | sha256sum -c - >/dev/null \
              || { echo "::error::yq checksum mismatch"; exit 1; }
            chmod +x "$YQ"
            OVERLAY="gitops/${OVERLAY_DIR:-$SERVICE}/stage/override.yaml"
            test -f "$OVERLAY" || { echo "::error::no stage overlay at $OVERLAY"; exit 1; }
            STAGE_IMAGE=$("$YQ" '.services.app.image' "$OVERLAY")
            RC_TAG="${STAGE_IMAGE##*:}"
          fi

          case "$RC_TAG" in
            "v$V-rc."*) ;;
            *) echo "::error::stage is running '$RC_TAG', which is not a candidate of $V."
               echo "::error::Release $V to stage first, or pass an explicit candidate number."
               exit 1 ;;
          esac

          git rev-parse -q --verify "refs/tags/$RC_TAG" >/dev/null \
            || { echo "::error::no git tag $RC_TAG — that candidate was never published"; exit 1; }

          # Which branch holds the stabilised work: a normal release, or a hotfix cut off main.
          if git rev-parse -q --verify "refs/remotes/origin/release/$V" >/dev/null; then
            SRC_BRANCH="release/$V"
          elif git rev-parse -q --verify "refs/remotes/origin/hotfix/$V" >/dev/null; then
            SRC_BRANCH="hotfix/$V"
          else
            echo "::error::neither release/$V nor hotfix/$V exists on origin — nothing to promote"
            exit 1
          fi

          {
            echo "RC_TAG=$RC_TAG"
            echo "SRC_BRANCH=$SRC_BRANCH"
          } >> "$GITHUB_ENV"
          echo "final_tag=v$V" >> "$GITHUB_OUTPUT"
          echo "promoting $RC_TAG from $SRC_BRANCH to prod as v$V"

      - name: Start the merge into main
        run: |
          set -euo pipefail
          git config user.name ci-bot
          git config user.email ci@rezatron
          git switch -C main origin/main

          # Idempotency guard: a re-run after a partial failure is a no-op, not an error.
          if git merge-base --is-ancestor "refs/tags/$RC_TAG" HEAD; then
            echo "main already contains $RC_TAG; skipping merge"
            echo "FORWARD_MERGE=skip" >> "$GITHUB_ENV"
            exit 0
          fi

          # This conflicts on pom.xml whenever main carries a commit develop has not
          # absorbed - which is true after every hotfix, and true of any service whose
          # first release predates this pipeline. main says the previous release, the
          # release branch says $V, and the merge base says neither. Exactly the shape the
          # back-merge already handles, so it gets the same treatment rather than a bare
          # merge that fails the promotion outright.
          if git merge --no-ff --no-commit "origin/$SRC_BRANCH"; then
            echo "FORWARD_MERGE=clean" >> "$GITHUB_ENV"
          else
            UNMERGED=$(git diff --name-only --diff-filter=U)
            if [ "$UNMERGED" != "pom.xml" ]; then
              echo "::error::promotion merge conflicts outside pom.xml, resolve by hand:"
              echo "$UNMERGED"
              git merge --abort
              exit 1
            fi
            echo "FORWARD_MERGE=pom-conflict" >> "$GITHUB_ENV"
          fi

      - name: Resolve the pom version conflict
        if: env.FORWARD_MERGE == 'pom-conflict'
        # main must end up carrying the released version, so this resolves to $V - the
        # mirror of the back-merge, which resolves to develop's -SNAPSHOT.
        uses: rezatron-labs/platform-ci/actions/resolve-pom-merge@v1
        with:
          version: ${{ inputs.version }}

      - name: Commit the merge, tag, and push
        if: env.FORWARD_MERGE != 'skip'
        run: |
          set -euo pipefail
          git add pom.xml
          git commit -m "release: promote v$V to prod"

      - name: Mint a token to push main
        id: main-push-token
        # continue-on-error so a missing or misconfigured App fails in the push step below
        # with an actionable message instead of this action's generic one. Nothing has been
        # pushed or deployed yet at this point, so failing there aborts the promotion cleanly.
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Tag the release and push main
        env:
          MAIN_PUSH_TOKEN: ${{ steps.main-push-token.outputs.token }}
        run: |
          set -euo pipefail
          # The final tag lands on main, where GitFlow says a release is born. The rc tags
          # record what was BUILT; this one records what SHIPPED.
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "tag v$V already exists; leaving it alone (immutable)"
          else
            git tag -a "v$V" -m "$SERVICE v$V"
          fi

          # main is pushed as the rezatron-release App, not GITHUB_TOKEN: every service repo
          # carries a "main-pipeline-only" ruleset that blocks main updates from everyone —
          # humans and stray automation alike — with the App as the sole bypass actor. The
          # promotion is therefore the only path that can write main, which is the platform's
          # actual invariant, now enforced rather than assumed.
          [ -n "${MAIN_PUSH_TOKEN:-}" ] \
            || { echo "::error::no App token — main only accepts pushes from the rezatron-release App (main-pipeline-only ruleset). Set the RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY org secrets and install the App on this repo."; exit 1; }
          #
          # The extraheader override is not optional: actions/checkout persists GITHUB_TOKEN
          # as an http.extraheader Authorization in .git/config, and that header silently WINS
          # over the token in the push URL — the push authenticates as github-actions[bot] and
          # the ruleset rejects it. Blanking the header for this one command is what makes the
          # App token actually reach GitHub (verified via the ruleset's rule-suites audit log,
          # which recorded the rejected pusher as github-actions[bot], not the App).
          git -c "http.https://github.com/.extraheader=" \
            push "https://x-access-token:${MAIN_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main

          # The tag still goes with GITHUB_TOKEN: the immutable-release-tags ruleset blocks
          # update and deletion of shipped v* tags, but creation is open to the workflow.
          git push origin "refs/tags/v$V"

      - name: Create the GitHub release
        # The candidates are published as prereleases so they never displace a real release.
        # This is the one that ships, so it is the one "latest release" should point at —
        # without this, every release on the platform is a prerelease and "latest" is empty.
        # Cosmetic, and it runs after main and the tag are pushed, so it must not fail the job.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\":\"v$V\",\"name\":\"v$V\",\"prerelease\":false,\"generate_release_notes\":true}"

      - name: Re-tag the validated candidate as the final version
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
        run: |
          set -euo pipefail
          printf '%s' "$NEXUS_PASS" | docker login "$REGISTRY" -u "$NEXUS_USER" --password-stdin
          SRC="$REGISTRY/$SERVICE:$RC_TAG"
          DST="$REGISTRY/$SERVICE:v$V"

          # Each digest is extracted in two stages, deliberately. A `grep` inside a pipeline
          # under `set -o pipefail` exits non-zero when it matches nothing, which killed the
          # step before the explicit emptiness check below could ever report why; and
          # `grep | head` can take a SIGPIPE and fail an otherwise-good promotion.
          docker pull "$SRC"
          INSPECT=$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "$SRC")
          SRC_DIGEST=$(printf '%s\n' "$INSPECT" | { grep -m1 "^$REGISTRY/$SERVICE@" || true; } | cut -d@ -f2)
          if [ -z "$SRC_DIGEST" ]; then
            echo "::error::could not read a registry digest for $SRC — cannot prove the promotion re-tags rather than rebuilds"
            echo "$INSPECT"
            exit 1
          fi

          docker tag "$SRC" "$DST"
          PUSH_OUT=$(docker push "$DST")
          DST_DIGEST=$(printf '%s\n' "$PUSH_OUT" | { grep -oE 'sha256:[0-9a-f]{64}' || true; } | tail -n1)
          if [ -z "$DST_DIGEST" ]; then
            echo "::error::could not read a digest from the push output — cannot verify the promotion"
            echo "$PUSH_OUT"
            exit 1
          fi

          # If these differ, something rebuilt instead of re-tagging and prod would be running
          # code stage never saw. That is the one thing this pipeline must not do.
          if [ "$SRC_DIGEST" != "$DST_DIGEST" ]; then
            echo "::error::promoted digest ($DST_DIGEST) does not match the validated candidate ($SRC_DIGEST)"
            exit 1
          fi
          echo "prod will run $DST @ $DST_DIGEST — byte-identical to $SRC"

  deploy-prod:
    needs: promote
    uses: rezatron-labs/platform-ci/.github/workflows/spring-deploy.yml@v1
    with:
      service: ${{ inputs.service }}
      env: prod
      image-tag: ${{ needs.promote.outputs.final_tag }}
      registry: ${{ inputs.registry }}
      gitops-repo: ${{ inputs.gitops-repo }}
      overlay-dir: ${{ inputs.overlay-dir }}
      runner: ${{ inputs.runner }}
    secrets: inherit

  close-out:
    # Housekeeping, deliberately after the deploy. Closing GitFlow's loop: develop picks up
    # anything stabilised on the release branch, and the branch itself is retired.
    needs: [promote, deploy-prod]
    runs-on: ${{ fromJSON(inputs.runner) }}
    env:
      V: ${{ inputs.version }}
    steps:
      - name: Checkout develop (full history for the merge)
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Start the back-merge of main into develop
        run: |
          set -euo pipefail
          git config user.name ci-bot
          git config user.email ci@rezatron
          git fetch --prune --tags origin "+refs/heads/*:refs/remotes/origin/*"
          git switch -C develop origin/develop

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "develop already contains main; nothing to back-merge"
            echo "BACKMERGE=skip" >> "$GITHUB_ENV"
            exit 0
          fi

          # Read develop's own version BEFORE the merge — it is the one thing that must
          # survive it.
          DEV_VERSION=$(./mvnw -B -q -DforceStdout help:evaluate -Dexpression=project.version | tail -n1 | tr -d '[:space:]')
          echo "DEV_VERSION=$DEV_VERSION" >> "$GITHUB_ENV"

          if git merge --no-ff --no-commit origin/main; then
            echo "BACKMERGE=clean" >> "$GITHUB_ENV"
          else
            # pom.xml conflicts on EVERY release: main says $V, develop says the next
            # -SNAPSHOT, and the merge base says neither. That one is expected. A conflict in
            # any OTHER file is real work, and stops the run.
            UNMERGED=$(git diff --name-only --diff-filter=U)
            if [ "$UNMERGED" != "pom.xml" ]; then
              echo "::error::back-merge conflicts outside pom.xml, resolve by hand:"
              echo "$UNMERGED"
              git merge --abort
              exit 1
            fi
            echo "BACKMERGE=pom-conflict" >> "$GITHUB_ENV"
          fi

      - name: Resolve the pom version conflict
        if: env.BACKMERGE == 'pom-conflict'
        uses: rezatron-labs/platform-ci/actions/resolve-pom-merge@v1
        with:
          version: ${{ env.DEV_VERSION }}

      - name: Restore develop's version after a clean merge
        if: env.BACKMERGE == 'clean'
        run: ./mvnw -B -q versions:set -DnewVersion="$DEV_VERSION" -DgenerateBackupPoms=false

      - name: Mint a token for the back-merge pull request
        id: app-token
        # continue-on-error so a missing or misconfigured App degrades to a clear message in
        # the step below rather than a failed release. The App exists only to open this PR;
        # everything load-bearing has already happened by here.
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Verify the back-merge and file it as a pull request
        if: env.BACKMERGE != 'skip'
        # develop cannot be pushed to directly: its required status checks run on
        # pull_request only, so a commit pushed straight there can never have them report and
        # the push is refused whoever makes it. The back-merge therefore arrives as a PR.
        #
        # Auto-merge uses MERGE, never SQUASH. The whole point of this commit is the merge
        # relationship it carries: squashing flattens it, main stops being an ancestor of
        # develop, and the NEXT promotion re-runs this same merge and hits the same pom
        # conflict again, forever.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          command -v python3 >/dev/null \
            || { echo "::error::python3 is not on this runner — cannot file the back-merge PR"; exit 1; }

          # The App token is what makes this work at all. GitHub does not trigger workflows
          # from events caused by GITHUB_TOKEN, so a PR opened with it gets NO checks -- and
          # develop requires checks, so that PR could never merge, by anyone, ever. An App
          # installation token is a different identity and its events trigger normally.
          #
          # The branch push above deliberately still uses GITHUB_TOKEN: nothing needs to
          # observe it, and the PR is opened once and never updated, so no later push event
          # has to fire either.
          [ -n "${GH_TOKEN:-}" ] \
            || { echo "::error::no App token — set the RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY org secrets and install the App on this repo. Opening the PR with GITHUB_TOKEN would produce one that can never be merged, so it is not attempted."; exit 1; }

          git add pom.xml
          # Gate the resolution before filing anything. The PR's own required checks are what
          # ultimately blocks the merge, so this run is duplicated work — and it is kept
          # anyway, because prod is already deployed by this point. A bad resolution has to
          # fail this run loudly and immediately; leaving it to the PR checks would report the
          # promotion as a success while develop silently never receives the back-merge.
          ./mvnw -B verify ${{ inputs.verify-args }}
          git commit -m "chore(release): back-merge v$V into develop (keep $DEV_VERSION)"

          BRANCH="chore/back-merge-v$V"
          git branch -f "$BRANCH" HEAD
          git push -f origin "$BRANCH"

          python3 - "$BRANCH" "$V" "$DEV_VERSION" <<'PY'
          import json, os, sys, urllib.error, urllib.request

          branch, version, dev_version = sys.argv[1], sys.argv[2], sys.argv[3]
          repo, token = os.environ["GITHUB_REPOSITORY"], os.environ["GH_TOKEN"]

          def call(url, payload):
              req = urllib.request.Request(
                  url, data=json.dumps(payload).encode(),
                  headers={"Authorization": "Bearer " + token,
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json"})
              return json.load(urllib.request.urlopen(req, timeout=30))

          try:
              pr = call("https://api.github.com/repos/%s/pulls" % repo, {
                  "title": "chore(release): back-merge v%s into develop" % version,
                  "head": branch, "base": "develop",
                  "body": ("Closes GitFlow's loop: develop picks up whatever was stabilised on "
                           "the release branch, keeping its own version `%s`.\n\nFiled as a "
                           "pull request because develop's required checks only run on "
                           "`pull_request`, so a direct push can never satisfy them.\n\n"
                           "**Merge with a merge commit, not a squash.** The value of this "
                           "commit is the merge relationship it carries; squashing it makes "
                           "main stop being an ancestor of develop, and the next promotion "
                           "re-runs this merge and hits the same pom conflict again."
                           % dev_version)})
          except urllib.error.HTTPError as e:
              body = e.read().decode(errors="replace")
              if e.code == 403 and "not permitted to create" in body:
                  print("::error::Actions is forbidden from creating pull requests. The "
                        "setting exists at BOTH org and repository level and the org one "
                        "does not override the repo one, so check the repository's own "
                        "'Allow GitHub Actions to create and approve pull requests'")
              sys.exit("::error::could not open the back-merge PR: %s %s" % (e.code, body[:300]))

          print("opened #%s" % pr["number"])

          try:
              r = call("https://api.github.com/graphql", {
                  "query": "mutation($id:ID!){enablePullRequestAutoMerge("
                           "input:{pullRequestId:$id,mergeMethod:MERGE}){clientMutationId}}",
                  "variables": {"id": pr["node_id"]}})
              if r.get("errors"):
                  sys.exit("::error::auto-merge refused, PR #%s left open: %s"
                           % (pr["number"], r["errors"]))
          except urllib.error.HTTPError as e:
              sys.exit("::error::auto-merge call failed, PR #%s left open: %s"
                       % (pr["number"], e.code))

          print("auto-merge armed on #%s" % pr["number"])
          PY

      - name: Retire the stabilisation branch
        run: |
          set -euo pipefail
          git fetch --prune origin
          for B in "release/$V" "hotfix/$V"; do
            if git rev-parse -q --verify "refs/remotes/origin/$B" >/dev/null; then
              git push origin --delete "$B"
              echo "deleted $B — main and the v$V tag are the durable record"
            fi
          done
