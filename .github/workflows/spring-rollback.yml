name: spring-rollback

# Recovery should be the best-rehearsed path in the pipeline, not the one improvised under
# pressure. Because every tag the platform publishes is immutable, rolling back is just
# deploying an older one: no build, no git surgery, no version arithmetic.
#
# It deliberately does NOT touch main or the pom. main records what was RELEASED; the gitops
# overlay records what is RUNNING; after a rollback those legitimately disagree, and the
# gitops commit is the audit trail of why. Roll forward with a hotfix to make them agree
# again — a rollback buys time, it does not close the incident.

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      env:
        description: "Environment to roll back: int, stage or prod"
        required: true
        type: string
      image-tag:
        description: "Tag to roll back to, e.g. v1.1.0 (must already exist in the registry)"
        required: true
        type: string
      registry:
        required: false
        default: nexus.home:8082
        type: string
      gitops-repo:
        required: false
        default: rezatron-labs/platform-gitops
        type: string
      overlay-dir:
        description: "Gitops overlay directory; defaults to <service>. Nested for platform stacks."
        required: false
        default: ""
        type: string
      runner:
        required: false
        default: '["self-hosted","unraid"]'
        type: string
    secrets:
      NEXUS_USER:
        required: true
      NEXUS_PASS:
        required: true
      GITOPS_DEPLOY_KEY:
        required: true

jobs:
  verify-image:
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      - name: Confirm the image exists before rewriting desired state
        env:
          IMAGE: ${{ inputs.registry }}/${{ inputs.service }}:${{ inputs.image-tag }}
          REGISTRY: ${{ inputs.registry }}
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
        run: |
          set -euo pipefail
          printf '%s' "$NEXUS_PASS" | docker login "$REGISTRY" -u "$NEXUS_USER" --password-stdin
          # A typo here would point an environment at a tag that does not exist, and the
          # failure would surface as a stuck deploy rather than a failed workflow.
          #
          # Three attempts, because none is reliable alone. `docker manifest` talks to the
          # registry directly, so the daemon's insecure-registries does not apply — hence
          # --insecure. But it is also an EXPERIMENTAL CLI command: where experimental
          # features are off it refuses outright, which previously looked identical to "tag
          # not found" and blamed the operator. `docker pull` goes through the daemon and
          # always works, so it is the arbiter; its stderr is kept and printed rather than
          # discarded, so a real failure says what actually went wrong.
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1 \
            || docker manifest inspect --insecure "$IMAGE" >/dev/null 2>&1; then
            echo "$IMAGE exists (manifest)"
          elif PULL_ERR=$(docker pull "$IMAGE" 2>&1); then
            echo "$IMAGE exists (pulled)"
          else
            echo "::error::cannot resolve $IMAGE in the registry — check the tag"
            echo "$PULL_ERR"
            exit 1
          fi
          echo "rolling ${{ inputs.env }} back to $IMAGE"

  deploy:
    needs: verify-image
    uses: rezatron-labs/platform-ci/.github/workflows/spring-deploy.yml@v1
    with:
      service: ${{ inputs.service }}
      env: ${{ inputs.env }}
      image-tag: ${{ inputs.image-tag }}
      registry: ${{ inputs.registry }}
      gitops-repo: ${{ inputs.gitops-repo }}
      overlay-dir: ${{ inputs.overlay-dir }}
      runner: ${{ inputs.runner }}
    secrets: inherit
