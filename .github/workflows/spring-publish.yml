name: spring-publish

# develop -> int, continuously. The only automatic deploy on the platform; every other
# environment change is a deliberate dispatch.

on:
  workflow_call:
    inputs:
      service:
        description: "Service name, e.g. orders"
        required: true
        type: string
      verify-args:
        description: >
          Extra arguments appended to `./mvnw -B verify`. A service whose integration tests
          cannot run on the self-hosted pool passes -DskipITs here and runs them in its own
          lane on a hosted runner.
        required: false
        default: ""
        type: string
      java-version:
        required: false
        default: "21"
        type: string
      registry:
        required: false
        default: nexus.home:8082
        type: string
      gitops-repo:
        required: false
        default: rezatron-labs/platform-gitops
        type: string
      overlay-dir:
        description: "Gitops overlay directory; defaults to <service>. Nested for platform stacks."
        required: false
        default: ""
        type: string
      runner:
        required: false
        default: '["self-hosted","unraid"]'
        type: string
    secrets:
      NEXUS_USER:
        required: true
      NEXUS_PASS:
        required: true
      GITOPS_DEPLOY_KEY:
        required: true

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runner) }}
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Build and test
        # spring-ci only covers pull_request, so anything reaching develop by a direct push —
        # including the version bumps spring-release makes — would otherwise deploy untested.
        run: ./mvnw -B verify ${{ inputs.verify-args }}

      - name: Compute immutable tag
        id: tag
        # Integration builds are tagged sha-<short commit>. Immutable: never overwritten.
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        # No host Maven step here: the Dockerfile builds the jar inside a maven image, so the
        # image build is the single source of truth for what ships.
        env:
          IMAGE: ${{ inputs.registry }}/${{ inputs.service }}:${{ steps.tag.outputs.tag }}
          REGISTRY: ${{ inputs.registry }}
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
        run: |
          set -euo pipefail
          printf '%s' "$NEXUS_PASS" | docker login "$REGISTRY" -u "$NEXUS_USER" --password-stdin
          # GIT_COMMIT lets the running application report which commit it was built from --
          # rto-tracker surfaces it at /api/v1/version and links it from its UI footer. Read
          # from the checked-out tree rather than from github.sha on purpose: release and
          # hotfix COMMIT a version bump before this step, so github.sha is the dispatch ref,
          # not the commit actually being built. HEAD is right in all three workflows.
          #
          # Safe for every service: Docker only WARNS about a build-arg the Dockerfile does not
          # declare, so a service without `ARG GIT_COMMIT` is unaffected.
          docker build --build-arg GIT_COMMIT="$(git rev-parse HEAD)" -t "$IMAGE" .
          docker push "$IMAGE"

  deploy-int:
    needs: build
    uses: rezatron-labs/platform-ci/.github/workflows/spring-deploy.yml@v1
    with:
      service: ${{ inputs.service }}
      env: int
      image-tag: ${{ needs.build.outputs.image_tag }}
      registry: ${{ inputs.registry }}
      gitops-repo: ${{ inputs.gitops-repo }}
      overlay-dir: ${{ inputs.overlay-dir }}
      runner: ${{ inputs.runner }}
    secrets: inherit
