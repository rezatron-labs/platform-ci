name: self-test

# This repo is the pipeline for every service on the platform, so a bad merge here breaks
# all of them at once. It gets its own gate.
#
# Runs on GitHub-hosted runners, deliberately: if the self-hosted pool is what's broken, the
# workflow that fixes the pipeline must not depend on it.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test the pom merge resolver
        run: sh actions/resolve-pom-merge/test-resolve-pom-merge.sh

      - name: Lint shell
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -s sh actions/resolve-pom-merge/*.sh

      - name: Parse every workflow and action
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in sorted(glob.glob('.github/workflows/*.yml') + glob.glob('actions/*/action.yml')):
              try:
                  yaml.safe_load(open(f))
                  print('ok  ', f)
              except Exception as e:
                  print('FAIL', f, e); bad = 1
          sys.exit(bad)
          PY

      - name: Every internal reference is pinned to a released tag
        # A reusable workflow calling a sibling by @main would make every service track this
        # repo's unreviewed tip. GitHub allows no variable in `uses:`, so the refs are literal
        # and this check is what keeps them honest when a new major is cut.
        run: |
          set -euo pipefail
          # Allow-list rather than deny-list: the previous check only rejected @main and
          # @master, so @develop or a feature branch passed, and it was hardcoded to this
          # repo's name so it went blind the moment the repo was renamed.
          REFS=$(grep -rhoE '\buses: [A-Za-z0-9._-]+/[A-Za-z0-9._-]+[^ ]*@[^ ]+' .github/workflows/ actions/ \
                 | sed 's/^uses: //' | sort -u)
          echo "external references:"
          echo "$REFS" | sed 's/^/  /'
          BAD=$(echo "$REFS" | grep -v '@v[0-9]' || true)
          if [ -n "$BAD" ]; then
            echo "::error::every reference must pin a release tag (@vN...), not a branch or SHA-less ref:"
            echo "$BAD"
            exit 1
          fi
